kind = "web"
previewPath = "/"
title = "DailyCruit"
version = "1.0.0"
id = "artifacts/dailycruit"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18120

[services.development]
run = "pnpm --filter @workspace/dailycruit run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dailycruit", "run", "build" ]
publicDir = "artifacts/dailycruit/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18120"
BASE_PATH = "/"
